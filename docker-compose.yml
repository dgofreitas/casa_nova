# Casa Nova no servidor (o mesmo do moneyTrackr e do Contopia).
#
# Uso no servidor, na pasta ~/casa-nova (o deploy do GitHub faz isso sozinho):
#   docker compose pull && docker compose up -d
#
# O HTTPS é do Caddy do moneyTrackr: o site entra na rede dele (EDGE_NETWORK) e o
# Caddyfile de lá tem o bloco de minhacasanova.duckdns.org apontando para
# casa-nova-app:3000. O nome do serviço vira nome de DNS nessa rede, por isso
# tem o prefixo "casa-nova-".
#
# Tudo o que importa fica no volume casa_nova_dados: o banco (casa-nova.db), os
# arquivos enviados, o casas.json e as fotos do crawler.

services:
  casa-nova-app:
    image: ghcr.io/dgofreitas/casa-nova-app:${IMAGE_TAG:-latest}
    container_name: casa_nova_app
    restart: always
    environment:
      - SENHA_DIOGO=${SENHA_DIOGO:-}
      - SENHA_CINTHIA=${SENHA_CINTHIA:-}
    volumes:
      - casa_nova_dados:/dados
    networks:
      - edge
    mem_limit: 256m
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  casa-nova-crawler:
    image: ghcr.io/dgofreitas/casa-nova-crawler:${IMAGE_TAG:-latest}
    container_name: casa_nova_crawler
    restart: always
    environment:
      - CASA_NOVA_HORARIOS=${CASA_NOVA_HORARIOS:-7,12,17,22}
      - CASA_NOVA_SITE=https://minhacasanova.duckdns.org
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TZ=America/Sao_Paulo
      # sites que recusam o endereço do servidor (OnLiving) saem pelo WARP
      - CASA_NOVA_PROXY=http://casa-nova-warp:1080
    volumes:
      - casa_nova_dados:/dados
    depends_on:
      - casa-nova-warp
    mem_limit: 768m
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # Cloudflare WARP (grátis) como saída alternativa, só para o crawler e só para os
  # sites que recusam o endereço do servidor. Sem porta publicada: só os containers
  # deste compose chegam nele (proxy HTTP e SOCKS5 na porta 1080).
  # Imagem: https://github.com/cmj2002/warp-docker
  casa-nova-warp:
    image: caomingjun/warp:latest
    container_name: casa_nova_warp
    restart: always
    device_cgroup_rules:
      - "c 10:200 rwm"
    environment:
      - WARP_SLEEP=5
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - casa_nova_warp:/var/lib/cloudflare-warp
    mem_limit: 256m
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

volumes:
  casa_nova_dados:
    name: casa_nova_dados
  casa_nova_warp:
    name: casa_nova_warp

networks:
  edge:
    name: ${EDGE_NETWORK:-moneytrackr_frontend}
    external: true
