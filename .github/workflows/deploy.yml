name: Publicar no servidor

# Monta as imagens do site e do crawler (arm64, a máquina da Oracle é ARM),
# manda para o GHCR e manda o servidor baixar e reiniciar. Mesma receita do
# moneyTrackr e do Contopia; o HTTPS é do Caddy do moneyTrackr.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY   os mesmos do Contopia
#   SENHA_DIOGO, SENHA_CINTHIA            as senhas de cada um no site

on:
  push:
    branches: [claude/hosting-real-estate-project-site-g8j87y]
    paths:
      - "server/**"
      - "site/**"
      - "crawler/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-casa-nova
  cancel-in-progress: false

env:
  IMAGE_APP: ghcr.io/${{ github.repository_owner }}/casa-nova-app
  IMAGE_CRAWLER: ghcr.io/${{ github.repository_owner }}/casa-nova-crawler

jobs:
  imagens:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nome: app
            dockerfile: server/Dockerfile
          - nome: crawler
            dockerfile: crawler/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/casa-nova-${{ matrix.nome }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/casa-nova-${{ matrix.nome }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,scope=${{ matrix.nome }},mode=max

  servidor:
    needs: imagens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os segredos
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SENHA_DIOGO: ${{ secrets.SENHA_DIOGO }}
          SENHA_CINTHIA: ${{ secrets.SENHA_CINTHIA }}
        run: |
          falta=""
          [ -n "$SSH_HOST" ] || falta="$falta SSH_HOST/SSH_USER/SSH_PRIVATE_KEY"
          [ -n "$SENHA_DIOGO" ] || falta="$falta SENHA_DIOGO"
          [ -n "$SENHA_CINTHIA" ] || falta="$falta SENHA_CINTHIA"
          if [ -n "$falta" ]; then echo "::error::Faltam segredos no repositório:$falta"; exit 1; fi
          case "$SENHA_DIOGO$SENHA_CINTHIA" in *"'"*) echo "::error::As senhas não podem ter aspas simples (')."; exit 1;; esac

      - name: Mandar o docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/casa-nova"
          overwrite: true

      - name: Baixar as imagens e reiniciar
        uses: appleboy/ssh-action@v1
        env:
          SENHA_DIOGO: ${{ secrets.SENHA_DIOGO }}
          SENHA_CINTHIA: ${{ secrets.SENHA_CINTHIA }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SENHA_DIOGO,SENHA_CINTHIA,IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/casa-nova
            umask 077
            # o .env é refeito a cada deploy a partir dos segredos do GitHub
            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "SENHA_DIOGO='$SENHA_DIOGO'"
              echo "SENHA_CINTHIA='$SENHA_CINTHIA'"
            } > .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            sleep 5
            docker compose ps
